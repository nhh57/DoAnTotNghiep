<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Trang Web</title>
	<style>
		.notification {
			padding: 15px;
			margin-bottom: 10px;
			border-radius: 5px;
			color: white;
			font-weight: bold;
			transition: opacity 0.5s ease-in-out;
		}

		.notification.success {
			background-color: #4caf50; / Màu xanh lá /
		}

		.notification.error {
			background-color: #f44336; / Màu đỏ /
		}

		#notification-container {
			position: fixed;
			top: 20px;
			right: 20px;
			z-index: 1000;
			max-width: 300px;
		}
	</style>

</head>
<body>
<header id="tg-header" class="tg-header tg-haslayout" th:fragment="header">
	<!-- Top bar -->
	<div class="tg-topbar">
		<div class="container">
			<div class="row">
				<div class="col-lg-12">
					<ul class="tg-addnav">
						<li><a href="#"><i class="icon-envelope"></i><em>Liên hệ</em></a></li>
						<li><a href="#"><i class="icon-question-circle"></i><em>Trợ giúp</em></a></li>
					</ul>
					<div class="tg-userlogin" th:if="${customer.email != null}">
						<div class="dropdown tg-themedropdown tg-currencydropdown">
							<a href="#" id="tg-currenty" class="tg-btnthemedropdown" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
								<i class="icon-earth"></i>
								<span>Chào, [[${customer.fullname}]]</span>
							</a>
							<ul class="dropdown-menu tg-themedropdownmenu">
								<li><a th:href="@{/logout}"><span>Đăng xuất</span></a></li>
							</ul>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Middle container -->
	<div class="tg-middlecontainer">
		<div class="container">
			<div class="row">
				<div class="col-lg-12">
					<strong class="tg-logo">
						<a th:href="@{/}">
							<img src="images/logoUpdate.png" alt="Logo" width="150px">
						</a>
					</strong>

					<div class="tg-wishlistandcart">
						<!-- Yêu thích -->
						<div class="dropdown tg-themedropdown tg-wishlistdropdown">
							<a href="/favorite" class="tg-btnthemedropdown">
								<span class="tg-themebadge" id="totalFavorite" th:text="${totalSave}"></span>
								<i class="icon-heart"></i>
								<span>Yêu thích</span>
							</a>
						</div>

						<!-- Giỏ hàng -->
						<div class="dropdown tg-themedropdown tg-minicartdropdown">
							<a href="#" id="tg-minicart" class="tg-btnthemedropdown" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
								<span class="tg-themebadge" id="totalCartItems" th:text="${totalCartItems}"></span>
								<i class="icon-cart"></i>
								<span>Giỏ hàng</span>
							</a>
							<!-- Dropdown Giỏ hàng -->
							<div class="dropdown-menu tg-themedropdownmenu" aria-labelledby="tg-minicart">
								<div class="tg-description" th:if="${cartItems == null || cartItems.size() == 0}">
									<p>Không có sản phẩm nào trong giỏ hàng!</p>
								</div>
								<div class="tg-minicartbody" th:each="item : ${cartItems}">
									<div class="tg-minicarproduct">
										<figure>
											<img th:src="@{'/loadImage?imageName='+${item.book.bookImage}}" alt="Book Image" width="50" height="50">
										</figure>
										<div class="tg-minicarproductdata">
											<h5><a href="#" th:text="${item.book.bookName}"></a></h5>
											<h6><a href="#" th:text="${#numbers.formatDecimal(item.book.price, 1, 'DEFAULT', 0, 'DEFAULT')} + ' VND'"></a></h6>
										</div>
									</div>
								</div>
								<div class="tg-minicartfoot">
									<a class="tg-btnemptycart" href="#"><i class="fa fa-trash-o"></i><span>Xóa giỏ hàng</span></a>
									<div class="tg-btns">
										<a class="tg-btn tg-active" href="/cartItem">Xem giỏ hàng</a>
										<a class="tg-btn" href="/checkout">Thanh toán</a>
									</div>
								</div>
							</div>
						</div>
					</div>

					<!-- Tìm kiếm -->
					<div class="tg-searchbox">
						<form th:action="@{/search}" class="tg-formtheme tg-formsearch">
							<fieldset>
								<input type="text" name="keyword" class="form-control" th:value="${keyword}" placeholder="Tìm kiếm theo tên sách...">
								<button type="submit"><i class="icon-magnifier"></i></button>
							</fieldset>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div id="notification-container"
		 style="position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);">
	</div>

	<!-- Navigation -->
	<div class="tg-navigationarea">
		<div class="container">
			<div class="row">
				<div class="col-lg-12">
					<nav id="tg-nav" class="tg-nav">
						<div class="navbar-header">
							<button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#tg-navigation">
								<span class="sr-only">Toggle navigation</span>
								<span class="icon-bar"></span>
								<span class="icon-bar"></span>
								<span class="icon-bar"></span>
							</button>
						</div>
						<div id="tg-navigation" class="collapse navbar-collapse tg-navigation">
							<ul>
								<li><a th:href="@{/index}">Trang Chủ</a></li>
								<li><a href="/products">Tất cả sản phẩm</a></li>
								<li><a th:href="@{/contact}">Liên Hệ</a></li>
								<li th:if="${customer.email == null}">
									<a href="/login">Đăng Nhập</a>
								</li>
								<li th:if="${customer.email == null}">
									<a href="/registered">Đăng Ký</a>
								</li>
							</ul>
						</div>
					</nav>
				</div>
			</div>
		</div>
	</div>
</header>
</body>
</html>
